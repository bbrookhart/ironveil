experiment_id: BROKEN-SEAL
name: OPERATION BROKEN SEAL
scope: synthetic local fixtures only
research_question: Can cryptographic signature validity alone prevent unauthorized installation?
systems:
  signature_only:
    evaluates: [artifact-subject, cryptographic-validity]
