name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.33
      - name: Install locked environment
        run: uv sync --frozen --all-extras
      - name: Static and architecture checks
        run: make lint typecheck security docs
      - name: Verification suite
        run: make test test-properties test-scenarios
      - name: Reproduce assurance experiment
        run: make build sbom provenance sign verify experiment evidence
