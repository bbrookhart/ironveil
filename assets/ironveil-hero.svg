  <text x="184" y="184" fill="#77e6bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="4">SOFTWARE &amp; FIRMWARE ASSURANCE</text>
  <g transform="translate(80 264)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    <g fill="#13232b" stroke="#41616d"><rect width="126" height="48" rx="6"/><rect x="166" width="126" height="48" rx="6"/><rect x="332" width="154" height="48" rx="6"/><rect x="526" width="126" height="48" rx="6"/><rect x="692" width="126" height="48" rx="6"/><rect x="858" width="158" height="48" rx="6"/></g>
