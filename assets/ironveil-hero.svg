  <title id="title">IRONVEIL software and firmware assurance</title>
  <desc id="desc">An artifact passes through source, build, provenance, signing, verification, and deployment gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#13232b"/></linearGradient>
    <linearGradient id="iron" x1="0" x2="1"><stop stop-color="#d8e1e6"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#8ca0aa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <path d="M0 330 L1200 230 L1200 420 L0 420Z" fill="#0d181e" opacity=".8"/>
  <g opacity=".18" stroke="#77e6bd"><path d="M0 86H1200M0 128H1200M0 170H1200M0 212H1200"/><path d="M150 0V260M300 0V260M450 0V260M600 0V260M750 0V260M900 0V260M1050 0V260"/></g>
